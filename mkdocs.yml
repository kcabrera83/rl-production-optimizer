site_name: RL Production Optimizer
site_description: Reinforcement learning for production optimization under uncertainty.
repo_url: https://github.com/kcabrera83/rl-production-optimizer
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
